name: Test bundles

# Started by hand from the Actions tab. Builds unsigned installers for macOS, Windows and Linux
# and attaches them to the run, so a build can be tried on each system without making a release.

on:
  workflow_dispatch:

# The job only reads the repository, so the GITHUB_TOKEN gets read access and nothing else.
# Attaching the installers to the run does not use the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install interface dependencies
        working-directory: ui
        run: npm ci

      # scripts/build.sh leaves out the signed bundles for the app's updater, because this
      # workflow has no signing key.
      - name: Build installers
        shell: bash
        run: bash scripts/build.sh --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: codjiva-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
