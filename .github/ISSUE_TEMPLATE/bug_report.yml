name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections
        below so we can reproduce and fix the issue.

        If an AI tool helped you write this, read it and check it against the actual
        behaviour before submitting. You are responsible for what you post here
        (see CONTRIBUTING.md).

        Do not report a security problem here. Follow the security policy
        (SECURITY.md) and send it by email.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open a folder
        2. Select '...' and click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Codjiva is affected?
      options:
        - Interface (explorer, tabs, inspector, job panel, settings)
        - Jobs (Visualise, Animate, Compose, Feedback)
        - A visual or a film (what was drawn, or how it plays)
        - Agents and API providers
        - Versions, staleness and the write guard
        - Export
        - Installing and updating
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Codjiva Version
      description: Version or commit hash (check Settings > Updates)
      placeholder: e.g. 0.3.0 or commit abc1234

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux

  - type: input
    id: agent
    attributes:
      label: Agent and Model
      description: >-
        The agent or API provider that ran the job, with its version and the
        model (check Settings > Agent). Leave empty if no job was involved.
      placeholder: e.g. Claude Code 2.1.0, sonnet

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: >-
        Paste the lines of the job panel, or attach screenshots. Remove
        anything from your own code that you do not want to publish.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information that might help.
