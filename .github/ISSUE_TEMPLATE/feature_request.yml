name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe what you'd like
        to see and why it would be useful.

        If an AI tool helped you write this, read it and check it against the actual
        behaviour before submitting. You are responsible for what you post here
        (see CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve? What's the use case?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Codjiva would this affect?
      options:
        - Interface (explorer, tabs, inspector, job panel, settings)
        - Jobs (Visualise, Animate, Compose, Feedback)
        - Visuals and films (what is drawn, and how it plays)
        - Versions, staleness and the write guard
        - Export
        - Installing and updating
        - New agent or API provider
        - New programming language
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important — affects my workflow
        - Critical — blocking my use of Codjiva

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, screenshots, links, or anything else.
