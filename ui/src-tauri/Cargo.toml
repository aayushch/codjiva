[package]
name = "codjiva-app"
description = "Codjiva: see your code work"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "codjiva_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
codjiva-core.workspace = true
codjiva-build.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.5"
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true

# The system webview's own snapshot call, used to capture what the window shows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSString", "NSValue", "NSGeometry"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
