[workspace]
resolver = "2"
members = [
  "crates/codjiva-build",
  "crates/codjiva-core",
  "crates/codjiva-nav",
  "ui/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Aayush Chawla"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.61", default-features = false }
base64 = "0.22"
thiserror = "2"
ignore = "0.4"
notify = "8"
notify-debouncer-mini = "0.7"
sha2 = "0.10"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tempfile = "3"
tokio-util = "0.7"
async-trait = "0.1"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
codjiva-build = { path = "crates/codjiva-build" }
codjiva-nav = { path = "crates/codjiva-nav" }
memchr = "2"
rayon = "1"
# The parsers that code navigation reads source files with. Each grammar crate
# compiles a C parser, so building the workspace needs a C compiler.
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
codjiva-core = { path = "crates/codjiva-core" }

# Stripping symbols breaks proc-macro loading with the linker shipped on macOS 27
# for Rust toolchains before 1.98, so release builds keep their symbols.
[profile.release]
strip = "none"
